<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="../js/checkout.js"></script>
  </head>

  <body>
    <header class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <div class="checkout">
          <form name="checkout">
            <fieldset>
              <legend>Shipping</legend>
              <label>
                First Name
                <input value="John" type="text" name="fname" id="fname" required />
              </label>
              <label>
                Last Name
                <input value="Doe" type="text" name="lname" id="lname" required />
              </label>
              <label>
                Street
                <input value="123 Main" type="text" name="street" id="street" required />
              </label>
              <label>
                City
                <input value="Rexburg" type="text" name="city" id="city" required />
              </label>
              <label>
                State
                <input value="ID" type="text" name="state" id="state" required />
              </label>
              <label>
                Zip
                <input value="83440" type="text" name="zip" id="zip" required />
              </label>
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <label>
                Card Number
                <input value="1234123412341234"
                  type="text"
                  name="cardNumber"
                  id="cardNumber"
                  required
                />
              </label>
              <label>
                Expiration
                <input value="8/21"
                  type="text"
                  name="expiration"
                  id="expiration"
                  required
                />
              </label>
              <label>
                Security Code
                <input value="123"
                  type="text"
                  name="code"
                  id="code"
                  required
                />
              </label>
            </fieldset>

            <div class="order-result">
              <h3>Order Summary</h3>
              <p>
                Subtotal:
                <span id="result-subtotal"></span>
              </p>
              <p>
                Number of Items:
                <span id="result-item-amount"></span>
              </p>
              <p>
                Shipping Estimate:
                <span id="result-shipping-estimate"></span>
              </p>
              <p>
                Tax:
                <span id="result-tax"></span>
              </p>
              <p>
                Order Total:
                <span id="result-order-total"></span>
              </p>
            </div>
            <button type="submit">Checkout</button>
          </form>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
